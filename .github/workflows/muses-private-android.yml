name: MUSES Private Android
on:
  push:
    branches: [fix/reader-import-goal-controls]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: muses-private-android
  cancel-in-progress: true
jobs:
  apk:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify signing configuration
        env:
          MUSES_KEYSTORE_B64: ${{ secrets.MUSES_KEYSTORE_B64 }}
          MUSES_KEYSTORE_PASSWORD: ${{ secrets.MUSES_KEYSTORE_PASSWORD }}
        run: |
          test -n "$MUSES_KEYSTORE_B64" && test -n "$MUSES_KEYSTORE_PASSWORD" || { echo "Private Android signing secrets missing"; exit 1; }
      - name: Prepare offline Android app
        run: bash scripts/prepare-android.sh
      - uses: android-actions/setup-android@v3
      - name: Compile APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          cd android-wrapper/android
          sed -i -E "s/versionCode [0-9]+/versionCode $GITHUB_RUN_NUMBER/; s/versionName \"[^\"]+\"/versionName \"1.0.$GITHUB_RUN_NUMBER\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign and verify
        env:
          MUSES_KEYSTORE_B64: ${{ secrets.MUSES_KEYSTORE_B64 }}
          MUSES_KEYSTORE_PASSWORD: ${{ secrets.MUSES_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$MUSES_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/muses.p12"
          trap 'rm -f "$RUNNER_TEMP/muses.p12"' EXIT
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -p 4 android-wrapper/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist-android
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/muses.p12" --ks-key-alias muses --ks-pass env:MUSES_KEYSTORE_PASSWORD --key-pass env:MUSES_KEYSTORE_PASSWORD --out dist-android/MUSES.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose dist-android/MUSES.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MUSES-private-android
          path: dist-android/MUSES.apk
          retention-days: 14
          if-no-files-found: error
